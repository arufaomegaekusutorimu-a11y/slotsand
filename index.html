<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS Safari ホーム画面追加（フルスクリーンPWA）設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="パチンコサンド">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@700;900&family=Share+Tech+Mono&display=swap');
        
        body {
            font-family: 'M+ PLUS 1p', sans-serif;
            background-color: #07090e;
            color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            
            /* iOSノッチ（セーフエリア）に対応するためのパディング設定 */
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        /* 画像上部の青色のぼんやりした発光シグナルを再現 */
        .blue-plasma-light {
            background: radial-gradient(circle, rgba(0,140,255,1) 0%, rgba(0,80,200,0.8) 40%, rgba(0,40,150,0) 70%);
            filter: blur(4px);
        }

        /* 20円貸プレートのカーブを完璧に再現 */
        .rate-plate {
            background: linear-gradient(to right, #ffffff 0%, #ffffff 85%, rgba(255,255,255,0) 100%);
            border-top-left-radius: 9999px;
            border-bottom-left-radius: 9999px;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.15), 0 4px 6px rgba(0,0,0,0.3);
        }

        /* 入金残高のピンク〜マゼンタのメタリックな傾斜グラデーション枠 */
        .pink-gradient-border {
            background: linear-gradient(135deg, #f43f5e 0%, #ec4899 30%, #d946ef 70%, #f43f5e 100%);
            padding: 2.5px;
            border-radius: 8px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.4);
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .pink-gradient-border:active {
            transform: scale(0.98);
            filter: brightness(1.2);
        }

        /* 持ちメダルのゴールド・イエローの傾斜グラデーション枠 */
        .gold-gradient-border {
            background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
            padding: 2.5px;
            border-radius: 8px;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 2px 4px rgba(0,0,0,0.4);
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .gold-gradient-border:active {
            transform: scale(0.99);
            filter: brightness(1.05);
        }

        /* 持ちメダルの内側：淡いグラデーション背景 */
        .tokens-inner-bg {
            background: linear-gradient(to bottom, #fffef0 0%, #fffbd4 40%, #fff7a1 100%);
            color: #1e293b;
        }

        /* 実機風のデジタル数字フォント */
        .real-digital-num {
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            font-weight: 700;
            letter-spacing: -0.05em;
        }

        /* 実機ボタンの立体感 */
        .real-push-btn {
            position: relative;
            transition: all 0.05s ease;
            box-shadow: 0 4px 0px #0f172a, 0 6px 12px rgba(0,0,0,0.6);
        }
        .real-push-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px #0f172a, 0 2px 4px rgba(0,0,0,0.6);
        }

        /* メインサンド筐体の重厚なメタルベゼル */
        .sand-bezel {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid #334155;
            box-shadow: inset 0 4px 10px rgba(255,255,255,0.05), 0 20px 45px rgba(0,0,0,0.8);
        }

        /* レシート風デザイン */
        .receipt-paper {
            background-color: #fcfbf7;
            color: #1e293b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background-image: radial-gradient(#e5e7eb 1px, transparent 0);
            background-size: 8px 8px;
        }
        .receipt-dashed {
            border-style: dashed;
            border-color: #94a3b8;
        }
    </style>
</head>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase設定のロード
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let userId = null;

        // グローバルへFirebaseアクセス関数を提供
        window.saveToCloud = async function(stateData) {
            if (!userId) return;
            try {
                const userDoc = doc(db, 'artifacts', appId, 'users', userId, 'sandProgress', 'current');
                await setDoc(userDoc, stateData);
            } catch (err) {
                console.error("Cloud save failed:", err);
            }
        };

        window.loadFromCloud = async function() {
            if (!userId) return null;
            try {
                const userDoc = doc(db, 'artifacts', appId, 'users', userId, 'sandProgress', 'current');
                const docSnap = await getDoc(userDoc);
                if (docSnap.exists()) {
                    return docSnap.data();
                }
            } catch (err) {
                console.error("Cloud load failed:", err);
            }
            return null;
        };

        // Firebase認証処理
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        initAuth();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userId = user.uid;
                // セーブデータをロード
                const savedData = await window.loadFromCloud();
                if (savedData) {
                    window.applyLoadedState(savedData);
                } else {
                    window.initDefaultState();
                }
            } else {
                window.initDefaultState();
            }
        });
    </script>

    <!-- Web Audio API 効果音演出 -->
    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSoundEffect(type) {
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } 
            else if (type === 'insert') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(550, now);
                osc.frequency.exponentialRampToValueAtTime(1100, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
            else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1400, now);
                osc.frequency.exponentialRampToValueAtTime(2000, now + 0.12);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                osc.start(now);
                osc.stop(now + 0.18);
            }
            else if (type === 'replay') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1600, now + 0.1);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            }
            else if (type === 'error') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }
    </script>

    <!-- 制御ロジック -->
    <script>
        // サンド本体の状態
        let state = {
            hasCard: false,
            balance: 0,
            tokens: 0,
            totalInvest: 0
        };

        // 精算時に一時保管するデータ
        let backupState = {
            hasCard: false,
            balance: 0,
            tokens: 0,
            totalInvest: 0
        };

        const RENT_PRICE = 1000;
        const REPLAY_TOKENS = 50;

        // DOM
        const balanceNum = document.getElementById('balance-num');
        const tokensNum = document.getElementById('tokens-num');
        const boxNum = document.getElementById('box-num');
        const lockStateIcon = document.getElementById('lock-state-icon');
        const msgWindow = document.getElementById('msg-window');
        const systemStatus = document.getElementById('system-status');
        
        // モーダル関連DOM
        const inputModal = document.getElementById('input-modal');
        const modalTokensInput = document.getElementById('modal-tokens-input');
        
        // レーシート結果モーダル関連DOM
        const resultModal = document.getElementById('result-modal');
        const receiptDate = document.getElementById('receipt-date');
        const receiptTotalInvest = document.getElementById('receipt-total-invest');
        const receiptReturnedBal = document.getElementById('receipt-returned-bal');
        const receiptNetInvest = document.getElementById('receipt-net-invest');
        const receiptTokens = document.getElementById('receipt-tokens');
        const receiptBoxes = document.getElementById('receipt-boxes');
        const receiptDiffTokens = document.getElementById('receipt-diff-tokens');
        const receiptDiffMoney = document.getElementById('receipt-diff-money');

        // 画面の更新
        function refreshDisplay() {
            balanceNum.textContent = state.balance.toLocaleString();
            tokensNum.textContent = state.tokens.toLocaleString();

            let calculatedBoxes = 0;
            if (state.tokens > 0) {
                calculatedBoxes = Math.floor(state.tokens / 713.565);
                if (calculatedBoxes === 0 && state.tokens > 0) {
                    calculatedBoxes = 1;
                }
            }
            boxNum.textContent = calculatedBoxes;

            if (state.hasCard) {
                lockStateIcon.className = "fa-solid fa-lock-open text-emerald-500";
                systemStatus.textContent = "CARD INSERTED - READY";
                systemStatus.className = "text-[9px] text-emerald-400 tracking-widest font-bold uppercase opacity-90";
            } else {
                lockStateIcon.className = "fa-solid fa-lock text-rose-500";
                systemStatus.textContent = "INSERT CASH / CARD";
                systemStatus.className = "text-[9px] text-cyan-400 tracking-widest font-bold uppercase opacity-80 animate-pulse";
            }
        }

        // 簡易通知メッセージ
        function logMessage(text, isWarning = false) {
            msgWindow.textContent = text;
            if (isWarning) {
                msgWindow.className = "bg-rose-950/80 rounded-lg p-2 text-center text-[11px] text-rose-400 border border-rose-900 min-h-[32px] flex items-center justify-center font-bold";
            } else {
                msgWindow.className = "bg-black/80 rounded-lg p-2 text-center text-[11px] text-cyan-300 border border-slate-900 min-h-[32px] flex items-center justify-center font-bold";
            }
        }

        // 数値変化時のフラッシュアニメーション
        function runFlashEffect(targetId) {
            const el = document.getElementById(targetId);
            if (!el) return;
            el.classList.add('scale-105', 'text-yellow-400');
            setTimeout(() => {
                el.classList.remove('scale-105', 'text-yellow-400');
            }, 100);
        }

        // 状態保存呼び出し用
        function saveState() {
            if (window.saveToCloud) {
                window.saveToCloud(state);
            }
        }

        // Firebaseがロードした状態を適用する窓口
        window.applyLoadedState = function(loadedState) {
            state.hasCard = loadedState.hasCard ?? false;
            state.balance = loadedState.balance ?? 0;
            state.tokens = loadedState.tokens ?? 0;
            state.totalInvest = loadedState.totalInvest ?? 0;
            refreshDisplay();
            logMessage("紙幣・カードをお入れください");
        };

        window.initDefaultState = function() {
            state.hasCard = false;
            state.balance = 0;
            state.tokens = 0;
            state.totalInvest = 0;
            refreshDisplay();
            logMessage("紙幣・カードをお入れください");
        };

        // 1. 入金残高枠タップで1万円チャージ
        function addTenThousand() {
            playSoundEffect('insert');
            state.hasCard = true;
            state.balance += 10000;
            state.totalInvest += 10000;
            logMessage("紙幣を受付しました");
            refreshDisplay();
            runFlashEffect('balance-num');
            saveState();
        }

        // 2. 貸出 (1,000円単位で減少)
        function onRentPress() {
            if (!state.hasCard || state.balance < RENT_PRICE) {
                playSoundEffect('error');
                logMessage("残高がありません", true);
                return;
            }

            playSoundEffect('coin');
            state.balance -= RENT_PRICE;

            logMessage("度数精算中");
            refreshDisplay();
            runFlashEffect('balance-num');
            saveState();
            
            // 2秒後に元の待機メッセージに戻す
            setTimeout(() => {
                if (state.hasCard) {
                    logMessage("カード残高をお確かめください");
                }
            }, 2000);
        }

        // 3. 再プレイ (持ちメダルから50枚減少)
        function onReplayPress() {
            if (state.tokens < REPLAY_TOKENS) {
                playSoundEffect('error');
                logMessage("持ちメダルが不足しています", true);
                return;
            }

            playSoundEffect('replay');
            state.tokens -= REPLAY_TOKENS;

            logMessage("再プレイ受付");
            refreshDisplay();
            runFlashEffect('tokens-num');
            saveState();
            
            setTimeout(() => {
                if (state.hasCard) {
                    logMessage("紙幣・カードをお入れください");
                }
            }, 2000);
        }

        // 4. カード返却（精算確認）
        function onReturnPress() {
            if (!state.hasCard) {
                playSoundEffect('error');
                logMessage("カードが挿入されていません", true);
                return;
            }

            playSoundEffect('insert');

            // 精算直前の実機データを一時保管
            backupState.hasCard = state.hasCard;
            backupState.balance = state.balance;
            backupState.tokens = state.tokens;
            backupState.totalInvest = state.totalInvest;
            
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            receiptDate.textContent = dateStr;

            const totalInvestVal = state.totalInvest;
            const returnedBalVal = state.balance;
            const netInvestVal = totalInvestVal - returnedBalVal;
            const tokensVal = state.tokens;

            let calculatedBoxes = 0;
            if (tokensVal > 0) {
                calculatedBoxes = Math.floor(tokensVal / 713.565);
                if (calculatedBoxes === 0 && tokensVal > 0) {
                    calculatedBoxes = 1;
                }
            }

            const earnedMoney = tokensVal * 20;
            const diffMoney = earnedMoney - netInvestVal;
            const diffTokens = tokensVal - (netInvestVal / 20);

            receiptTotalInvest.textContent = `${totalInvestVal.toLocaleString()} 円`;
            receiptReturnedBal.textContent = `${returnedBalVal.toLocaleString()} 円`;
            receiptNetInvest.textContent = `${netInvestVal.toLocaleString()} 円`;
            receiptTokens.textContent = tokensVal.toLocaleString();
            receiptBoxes.textContent = `${calculatedBoxes} 箱`;

            if (diffTokens >= 0) {
                receiptDiffTokens.textContent = `+${Math.floor(diffTokens).toLocaleString()} 枚`;
                receiptDiffTokens.className = "font-bold text-emerald-600";
            } else {
                receiptDiffTokens.textContent = `${Math.floor(diffTokens).toLocaleString()} 枚`;
                receiptDiffTokens.className = "font-bold text-rose-600";
            }

            if (diffMoney >= 0) {
                receiptDiffMoney.textContent = `+${diffMoney.toLocaleString()} 円`;
                receiptDiffMoney.className = "font-bold text-emerald-600";
            } else {
                receiptDiffMoney.textContent = `${diffMoney.toLocaleString()} 円`;
                receiptDiffMoney.className = "font-bold text-rose-600";
            }

            // 見た目上、排出したように見せる
            state.hasCard = false;
            state.balance = 0;
            refreshDisplay();

            resultModal.classList.remove('hidden');
        }

        // 「遊技を続ける」が押されたときの復帰処理 (確実な引き継ぎ)
        function closeResultModal() {
            playSoundEffect('insert');
            
            // バックアップから完全に復元
            state.hasCard = backupState.hasCard;
            state.balance = backupState.balance;
            state.tokens = backupState.tokens;
            state.totalInvest = backupState.totalInvest;

            refreshDisplay();
            resultModal.classList.add('hidden');
            logMessage("度数カード受付中");
            saveState();
        }

        // 「完全にリセットして戻る」が押されたときのみ完全消去
        function resetAllState() {
            playSoundEffect('click');
            
            state.hasCard = false;
            state.balance = 0;
            state.tokens = 0;
            state.totalInvest = 0;
            
            backupState.hasCard = false;
            backupState.balance = 0;
            backupState.tokens = 0;
            backupState.totalInvest = 0;

            refreshDisplay();
            resultModal.classList.add('hidden');
            logMessage("紙幣・カードをお入れください");
            saveState();
        }

        // --- 持ちメダル入力モーダル関連ロジック ---
        function openTokensModal() {
            playSoundEffect('click');
            modalTokensInput.value = state.tokens;
            inputModal.classList.remove('hidden');
            setTimeout(() => {
                modalTokensInput.focus();
                modalTokensInput.select();
            }, 50);
        }

        function closeTokensModal() {
            playSoundEffect('click');
            inputModal.classList.add('hidden');
        }

        function setModalQuickValue(value) {
            playSoundEffect('click');
            modalTokensInput.value = value;
        }

        function submitTokensModal() {
            let value = parseInt(modalTokensInput.value, 10);
            if (isNaN(value) || value < 0) {
                value = 0;
            }
            
            playSoundEffect('insert');
            state.tokens = value;
            logMessage("計数データ反映完了");
            
            refreshDisplay();
            runFlashEffect('tokens-num');
            
            inputModal.classList.add('hidden');
            saveState();
            
            setTimeout(() => {
                logMessage("紙幣・カードをお入れください");
            }, 2000);
        }

        // --- Screen Wake Lock API (画面消灯防止) の実装 ---
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock is active.');
                }
            } catch (err) {
                console.warn(`Wake Lock request failed: ${err.message}`);
            }
        }

        // ページがアクティブになったときにWake Lockを再要求
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // ユーザーが画面に触れたタイミングでスリープ防止ロックを確実にトリガー
        window.addEventListener('click', () => {
            if (!wakeLock) {
                requestWakeLock();
            }
        });
        window.addEventListener('touchstart', () => {
            if (!wakeLock) {
                requestWakeLock();
            }
        });

        // 初期ロード時
        window.addEventListener('load', () => {
            state.tokens = 0;
            refreshDisplay();
            requestWakeLock();
        });
    </script>
</body>
</html>
